<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숙제·수업 확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#F7F6F3; --surface:#FFFFFF; --soft:#F2F0EC; --border:#E4E1DB; --ink:#20242B; --ink-soft:#5E6470; --ink-faint:#8C919B;
    --brand:#C8232C; --bar:#2A1F3D; --bar-ink:#FFFFFF; --bar-soft:#CFC6DE; --focus:#3D5BD9;
    --t-jr:#2F7D5A; --t-jr-bg:#E7F3ED; --t-hw:#2D58C8; --t-hw-bg:#E8EEFC; --t-dt:#8A4FC4; --t-dt-bg:#F2EAFB; --t-mo:#B5651D; --t-mo-bg:#FCF1E4;
    --elem:#1F8A5B; --elem-bg:#E9F8F0; --elem-bd:#9FDDBE; --mid:#2D58C8; --mid-bg:#EEF3FE; --mid-bd:#A9C0F2;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --ground:#16171B; --surface:#1F2126; --soft:#272A30; --border:#33363D; --ink:#ECEDEF; --ink-soft:#B0B4BC; --ink-faint:#80858F;
    --brand:#EF5A62; --bar:#231A33; --bar-soft:#A99DBE; --focus:#8EA4FF;
    --t-jr:#6FCB9C; --t-jr-bg:#1F3329; --t-hw:#8EA9F0; --t-hw-bg:#1F2740; --t-dt:#C49BEB; --t-dt-bg:#2B2238; --t-mo:#E9A867; --t-mo-bg:#352818;
    --elem:#6FCB9C; --elem-bg:#1C2D25; --elem-bd:#2F5C46; --mid:#8EA9F0; --mid-bg:#1E2638; --mid-bd:#3A4C7A;
  } }
  :root[data-theme="dark"]{
    --ground:#16171B; --surface:#1F2126; --soft:#272A30; --border:#33363D; --ink:#ECEDEF; --ink-soft:#B0B4BC; --ink-faint:#80858F;
    --brand:#EF5A62; --bar:#231A33; --bar-soft:#A99DBE; --focus:#8EA4FF;
    --t-jr:#6FCB9C; --t-jr-bg:#1F3329; --t-hw:#8EA9F0; --t-hw-bg:#1F2740; --t-dt:#C49BEB; --t-dt-bg:#2B2238; --t-mo:#E9A867; --t-mo-bg:#352818;
    --elem:#6FCB9C; --elem-bg:#1C2D25; --elem-bd:#2F5C46; --mid:#8EA9F0; --mid-bg:#1E2638; --mid-bd:#3A4C7A;
  }
  *{ box-sizing:border-box; }
  html, body{ margin:0; }
  body{ background:var(--ground); color:var(--ink); font-family:'Noto Sans KR', system-ui, sans-serif; font-size:15px; line-height:1.6; word-break:keep-all; -webkit-text-size-adjust:100%; }
  button, input{ font:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  .bar{ background:var(--bar); color:var(--bar-ink); }
  .bar-in{ max-width:640px; margin:0 auto; padding:18px 16px 16px; display:flex; align-items:center; gap:12px; min-height:76px; }
  .bar img{ width:36px; height:36px; border-radius:8px; background:#fff; padding:3px; flex:none; }
  .bar .back{ width:40px; height:40px; margin-left:-8px; border:0; background:none; color:var(--bar-ink); border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
  .bar .back[hidden]{ display:none; }
  .bar b{ display:block; font-size:17px; font-weight:800; line-height:1.3; }
  .bar small{ display:block; font-size:12.5px; color:var(--bar-soft); }

  main{ max-width:640px; margin:0 auto; padding:28px 16px 40px; }
  .foot{ text-align:center; font-size:12px; color:var(--ink-faint); margin:36px 0 0; }

  /* 처음 화면 */
  .hello{ text-align:center; margin-bottom:20px; }
  .hello h1{ margin:0; font-size:20px; font-weight:800; }
  .hello p{ margin:6px 0 0; font-size:15.5px; font-weight:800; color:var(--brand); }
  .search{ position:relative; }
  .search svg{ position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none; }
  .search input{ width:100%; height:60px; border:2px solid var(--border); border-radius:14px; background:var(--surface); padding:0 18px 0 50px; font-size:17px; box-shadow:0 2px 10px rgba(30,30,40,0.05); }
  .search input:focus{ outline:none; border-color:var(--focus); }
  .hint{ font-size:13px; color:var(--ink-soft); margin:10px 2px 0; }
  .results{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .or{ display:flex; align-items:center; gap:14px; color:var(--ink-faint); font-size:13px; margin:28px 0; }
  .or::before, .or::after{ content:''; flex:1; height:1px; background:var(--border); }
  .row{ width:100%; display:flex; align-items:center; gap:14px; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; min-height:64px; font-size:16px; font-weight:700; }
  .row .ic{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none; font-size:18px; }
  .row .tx{ flex:1; min-width:0; }
  .row .tx small{ display:block; font-size:12.5px; font-weight:500; color:var(--ink-soft); }
  .row .chev{ color:var(--ink-faint); flex:none; }
  .row.elem{ background:var(--elem-bg); border-color:var(--elem-bd); color:var(--elem); }
  .row.mid{ background:var(--mid-bg); border-color:var(--mid-bd); color:var(--mid); }
  .list{ display:flex; flex-direction:column; gap:10px; }
  .grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
  .grid .row{ min-height:60px; padding:12px 16px; font-size:15.5px; }
  .grid .row.elem, .grid .row.mid{ background:var(--surface); }
  .sec-t{ font-size:13px; font-weight:800; color:var(--ink-soft); margin:22px 2px 10px; }
  .empty{ background:var(--surface); border:1px dashed var(--border); border-radius:14px; padding:22px 18px; text-align:center; color:var(--ink-soft); font-size:14px; }

  /* 학생 화면 */
  .who{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .who h2{ margin:0; font-size:20px; font-weight:800; }
  .who span{ font-size:13px; color:var(--ink-soft); }
  .tabs{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; background:var(--soft); border-radius:14px; padding:5px; position:sticky; top:0; z-index:2; }
  .tabs button{ border:0; background:none; border-radius:10px; padding:10px 4px; font-size:14px; font-weight:700; color:var(--ink-soft); min-height:46px; line-height:1.25; }
  .tabs button[aria-selected="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 1px 4px rgba(30,30,40,0.1); }
  .tabs button i{ display:block; font-style:normal; font-size:11px; font-weight:600; color:var(--ink-faint); }
  .posts{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .post{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  .post-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .post-h b{ font-size:15px; }
  .post-h time{ font-size:12.5px; color:var(--ink-faint); margin-left:auto; }
  .pill{ font-size:11.5px; font-weight:800; border-radius:99px; padding:2px 9px; }
  .pill.jr{ background:var(--t-jr-bg); color:var(--t-jr); } .pill.hw{ background:var(--t-hw-bg); color:var(--t-hw); }
  .pill.daily{ background:var(--t-dt-bg); color:var(--t-dt); } .pill.monthly{ background:var(--t-mo-bg); color:var(--t-mo); }
  .post p{ margin:0; font-size:15px; }
  .post pre{ margin:0; white-space:pre-wrap; font-family:inherit; font-size:14.5px; line-height:1.7; }
  .sample{ font-size:11px; font-weight:700; color:var(--ink-faint); }

  .lock{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px 18px; margin-top:14px; text-align:center; }
  .lock h3{ margin:0 0 4px; font-size:16px; }
  .lock p{ margin:0 0 14px; font-size:13.5px; color:var(--ink-soft); }
  .lock form{ display:flex; gap:8px; max-width:320px; margin:0 auto; }
  .lock input{ flex:1; min-width:0; height:52px; border:2px solid var(--border); border-radius:12px; background:var(--ground); text-align:center; font-size:22px; letter-spacing:8px; font-weight:800; }
  .lock input:focus{ outline:none; border-color:var(--focus); }
  .lock button{ height:52px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-weight:800; padding:0 18px; }
  .lock .err{ color:var(--brand); font-size:13px; font-weight:700; margin:10px 0 0; min-height:1em; }
  .demo{ font-size:12px; color:var(--ink-faint); margin:12px 0 0; }
  .note{ font-size:12.5px; color:var(--ink-faint); margin:16px 2px 0; line-height:1.6; }

  @media (min-width: 700px){
    main{ padding-top:40px; }
    .hello h1{ font-size:22px; }
    .grid{ grid-template-columns:repeat(3, minmax(0,1fr)); }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <button type="button" class="back" id="back" aria-label="뒤로" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15,5 8,12 15,19"/></svg></button>
    <img src="logo.png" alt="" id="logo">
    <div><b>비욘드잉글리쉬 사직어학원</b><small id="sub">숙제 · 수업 내용 확인</small></div>
  </div>
</header>
<main id="app"></main>

<script>
/* 학부모·학생 알림 페이지
   업무 화면(admin.html)이 자동으로 올리는 학생별 알림(진도·숙제·데일리 테스트·월말 리포트)을 보여 줘요.
   이름 앞 2글자 또는 반으로 찾아요. 데일리 테스트·월말 리포트는 학부모 번호 뒷자리 4개를 넣어야 열려요.
   시안이라 업무 화면과 같은 브라우저에 저장된 기록만 보여요. 공용 저장소를 연결하면 어디서나 보여요. */
var PUB_KEY = 'beyond-public-v1', NT_KEY = 'beyond-notice-v1', UNLOCK_KEY = 'beyond-parent-unlock';
var DAYS = ['일','월','화','수','목','금','토'];
// 업무 화면을 아직 열지 않았을 때 보여 줄 예시 반 목록
var SAMPLE_CLASSES = [
  { id:'p-a', dept:'초등부', name:'파닉스 A', students:['김하준','이서윤','박지호','최아린','정우진','강예은','조민서','윤지안'] },
  { id:'r-1', dept:'초등부', name:'초등 리딩 1', students:['임서진','배준서','홍지우','유하은','남건우','문서아','장민재','전수아','고은우','양태윤'] },
  { id:'m-a', dept:'중등부', name:'중등 내신 A', students:['김태현','이지원','박선우','최예진','정현수','강소연','조성민','윤하늘','임재원'] }
];
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function readJSON(k, d){ try{ var v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; }catch(e){ return d; } }
var pub = readJSON(PUB_KEY, null);
var CLASSES = pub && Array.isArray(pub.classes) && pub.classes.length ? pub.classes : SAMPLE_CLASSES;
var PIN = pub && pub.pin ? pub.pin : {};
var usingSample = !(pub && pub.classes && pub.classes.length);
var unlocked = (function(){ try{ return JSON.parse(sessionStorage.getItem(UNLOCK_KEY) || '{}') || {}; }catch(e){ return {}; } })();
function saveUnlock(){ try{ sessionStorage.setItem(UNLOCK_KEY, JSON.stringify(unlocked)); }catch(e){} }

function posts(){ var o = readJSON(NT_KEY, null); return o && Array.isArray(o.posts) ? o.posts : []; }
// 아직 올라온 알림이 없을 때만 화면 확인용 예시를 보여 줘요
function samplePosts(cid, s){
  var t = new Date(), d = function(n){ var x = new Date(t); x.setDate(t.getDate() - n); return x.getFullYear() + '-' + ('0'+(x.getMonth()+1)).slice(-2) + '-' + ('0'+x.getDate()).slice(-2); };
  return [
    { type:'jr', cid:cid, s:s, date:d(0), prog:'FUN PHONICS > (1-3)', hw:'SB page 15-16 · PB page 11-13 · 단어 20개 암기', sample:true },
    { type:'jr', cid:cid, s:s, date:d(2), prog:'FUN PHONICS > (1-2)', hw:'SB page 12-14', sample:true },
    { type:'daily', cid:cid, s:s, date:d(0), title:'데일리 리포트', text:'출결: 출석\n교재: 지참\n숙제: 완료 / Speaking: 완료\n단어: 1회 18/20 → 완료\n진도: FUN PHONICS > (1-3)\n숙제: SB page 15-16', sample:true }
  ];
}
function postsFor(cid, s){
  var all = posts().filter(function(p){ return p.cid === cid && p.s === s; });
  if(!all.length && !posts().length) all = samplePosts(cid, s);
  return all.sort(function(a, b){ return b.date.localeCompare(a.date) || (b.at || 0) - (a.at || 0); });
}
// 이름은 앞 두 글자만 보이고 나머지는 가려요 (김하준 → 김하*)
function mask(name, keep){ keep = Math.min(keep || 1, name.length - 1); return name.slice(0, keep) + '*'.repeat(Math.max(1, name.length - keep)); }
function cls(id){ return CLASSES.find(function(c){ return c.id === id; }); }
function fmtDate(s){
  if(/^\d{4}-\d{2}$/.test(s)){ return s.slice(0, 4) + '년 ' + (+s.slice(5)) + '월'; }
  var p = s.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
  return (d.getMonth()+1) + '/' + d.getDate() + ' (' + DAYS[d.getDay()] + ')';
}

/* ===== 화면 이동: #/ · #/dept · #/dept/초등부 · #/class/r-1 · #/s/r-1/이름 ===== */
var app = document.getElementById('app'), q = '', tab = 'jr';
function go(h){ location.hash = h; }
function route(){
  var h = decodeURIComponent(location.hash.replace(/^#\/?/, '')), p = h.split('/');
  document.getElementById('back').hidden = !h;
  if(p[0] === 'dept' && p[1]) return viewClasses(p[1]);
  if(p[0] === 'dept') return viewDepts();
  if(p[0] === 'class' && cls(p[1])) return viewClass(cls(p[1]));
  if(p[0] === 's' && cls(p[1]) && cls(p[1]).students.indexOf(p[2]) !== -1) return viewStudent(cls(p[1]), p[2]);
  viewHome();
}
function setSub(t){ document.getElementById('sub').textContent = t; }
var FOOT = '<p class="foot">비욘드잉글리쉬 사직어학원</p>';

function viewHome(){
  setSub('숙제 · 수업 내용 확인');
  app.innerHTML = '<div class="hello"><h1>숙제와 수업 내용을 확인하세요</h1><p>이름 앞 2글자를 입력하세요</p></div>' +
    '<div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>' +
    '<input type="search" id="q" inputmode="text" autocomplete="off" placeholder="예: 김하, 이서, 박지 …" aria-label="이름 앞 2글자" value="' + esc(q) + '"></div>' +
    '<div class="results" id="res" aria-live="polite"></div>' +
    '<div class="or">또는</div>' +
    '<button type="button" class="row" data-go="#/dept"><span class="ic" aria-hidden="true">📚</span><span class="tx">반에서 찾기</span>' + CHEV + '</button>' +
    (usingSample ? '<p class="note">지금은 화면 확인용 예시 반이에요. 업무 화면에서 기록하면 실제 반과 알림이 보여요.</p>' : '') + FOOT;
  var input = document.getElementById('q');
  input.addEventListener('input', function(){ q = input.value.trim(); renderResults(); });
  renderResults();
}
var CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9,5 16,12 9,19"/></svg>';
function renderResults(){
  var box = document.getElementById('res'); if(!box) return;
  if(q.length < 2){ box.innerHTML = q.length ? '<p class="hint">두 글자까지 입력해 주세요.</p>' : ''; return; }
  var hit = [];
  CLASSES.forEach(function(c){ c.students.forEach(function(s){ if(s.indexOf(q.slice(0, 2)) === 0 && s.indexOf(q) === 0) hit.push({ c:c, s:s }); }); });
  box.innerHTML = hit.length ? hit.map(function(x){
    return '<button type="button" class="row" data-go="#/s/' + esc(x.c.id) + '/' + encodeURIComponent(x.s) + '"><span class="tx">' + esc(mask(x.s, 2)) + '<small>' + esc(x.c.dept + ' · ' + x.c.name) + '</small></span>' + CHEV + '</button>';
  }).join('') : '<p class="hint">찾는 이름이 없어요. 이름 앞 2글자를 다시 확인하거나 반에서 찾아 주세요.</p>';
}
function deptOf(){ var out = []; CLASSES.forEach(function(c){ if(out.indexOf(c.dept) === -1) out.push(c.dept); }); return out; }
function deptCls(d){ return d === '초등부' ? 'elem' : 'mid'; }
function deptIcon(d){ return d === '초등부' ? '✏️' : '📘'; }
function viewDepts(){
  setSub('반에서 찾기');
  app.innerHTML = '<div class="list">' + deptOf().map(function(d){
    return '<button type="button" class="row ' + deptCls(d) + '" data-go="#/dept/' + encodeURIComponent(d) + '"><span class="ic" aria-hidden="true">' + deptIcon(d) + '</span><span class="tx">' + esc(d) + '</span>' + CHEV + '</button>';
  }).join('') + '</div>' + FOOT;
}
function viewClasses(d){
  setSub(d + ' · 반 선택');
  var list = CLASSES.filter(function(c){ return c.dept === d; });
  app.innerHTML = (list.length ? '<div class="grid">' + list.map(function(c){
    return '<button type="button" class="row ' + deptCls(d) + '" data-go="#/class/' + esc(c.id) + '"><span class="tx">' + esc(c.name) + '</span></button>';
  }).join('') + '</div>' : '<div class="empty">이 부서에 반이 없어요.</div>') + FOOT;
}
function viewClass(c){
  setSub(c.dept + ' · ' + c.name);
  app.innerHTML = '<p class="sec-t">학생을 골라 주세요</p><div class="grid">' + c.students.map(function(s){
    return '<button type="button" class="row ' + deptCls(c.dept) + '" data-go="#/s/' + esc(c.id) + '/' + encodeURIComponent(s) + '"><span class="tx">' + esc(mask(s, 2)) + '</span></button>';
  }).join('') + '</div>' + FOOT;
}

var TABS = [['jr','진도'],['hw','숙제'],['daily','데일리 테스트'],['monthly','월말 리포트']];
function viewStudent(c, s){
  setSub(c.dept + ' · ' + c.name);
  var all = postsFor(c.id, s), key = c.id + '|' + s;
  var count = function(t){ return all.filter(function(p){ return t === 'jr' ? p.type === 'jr' && p.prog : t === 'hw' ? p.type === 'jr' && p.hw : p.type === t; }).length; };
  app.innerHTML = '<div class="who"><h2>' + esc(mask(s, 2)) + '</h2><span>' + esc(c.name) + '</span></div>' +
    '<div class="tabs" role="tablist">' + TABS.map(function(t){ return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + t[1] + '<i>' + count(t[0]) + '건</i></button>'; }).join('') + '</div>' +
    '<div id="tabBody"></div>' + FOOT;
  renderTab(c, s, all, key);
}
function renderTab(c, s, all, key){
  var body = document.getElementById('tabBody'), need = tab === 'daily' || tab === 'monthly';
  // 데일리 테스트·월말 리포트에는 점수와 선생님 의견이 있어서 학부모 번호 뒷자리를 확인해요
  if(need && !unlocked[key]){
    body.innerHTML = '<div class="lock"><h3>학부모 번호 뒷자리를 넣어 주세요</h3><p>점수와 선생님 의견이 들어 있어서 확인 후에 보여 드려요.</p>' +
      '<form id="pinForm"><input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="학부모 번호 뒷자리 4개"><button type="submit">확인</button></form><p class="err" id="pinErr"></p>' +
      (PIN[key] ? '<p class="demo">시안용 예시 번호: ' + esc(PIN[key]) + '</p>' : '<p class="demo">업무 화면을 연 적이 없어 예시 반이에요. 아무 숫자 4개나 넣어 보세요.</p>') + '</div>';
    document.getElementById('pinForm').addEventListener('submit', function(ev){
      ev.preventDefault();
      var v = document.getElementById('pin').value.trim();
      if(!/^\d{4}$/.test(v)){ document.getElementById('pinErr').textContent = '숫자 4개를 넣어 주세요.'; return; }
      if(PIN[key] && PIN[key] !== v){ document.getElementById('pinErr').textContent = '번호가 맞지 않아요. 다시 확인해 주세요.'; return; }
      unlocked[key] = true; saveUnlock(); renderTab(c, s, all, key);
    });
    return;
  }
  var list = all.filter(function(p){ return tab === 'jr' ? p.type === 'jr' && p.prog : tab === 'hw' ? p.type === 'jr' && p.hw : p.type === tab; });
  var label = { jr:'진도', hw:'숙제', daily:'데일리', monthly:'월말' }[tab];
  var emptyMsg = { jr:'아직 올라온 진도가 없어요. 선생님이 수업 기록을 저장하면 자동으로 올라와요.', hw:'아직 올라온 숙제가 없어요. 선생님이 수업 기록을 저장하면 자동으로 올라와요.',
    daily:'아직 올라온 데일리 테스트 리포트가 없어요. 데일리 테스트를 발송하면 자동으로 올라와요.', monthly:'아직 올라온 월말 리포트가 없어요. 원장님 확인 후 발송하면 자동으로 올라와요.' }[tab];
  body.innerHTML = '<div class="posts">' + (list.length ? list.map(function(p){
    var head = '<div class="post-h"><span class="pill ' + tab + '">' + label + '</span>' + (p.title ? '<b>' + esc(p.title.replace(/^\d+월 \d+일 \(.\) /, '')) + '</b>' : '') + (p.sample ? '<span class="sample">예시</span>' : '') + '<time>' + esc(fmtDate(p.date)) + '</time></div>';
    var main = tab === 'jr' ? '<p>' + esc(p.prog) + '</p>' : tab === 'hw' ? '<p>' + esc(p.hw) + '</p>' : '<pre>' + esc(String(p.text || '').split('\n').filter(function(l, i){ return !(i === 0 && /^\[/.test(l)); }).join('\n')) + '</pre>';
    return '<article class="post">' + head + main + '</article>';
  }).join('') : '<div class="empty">' + emptyMsg + '</div>') + '</div>';
}

document.addEventListener('click', function(ev){
  var g = ev.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  var t = ev.target.closest('[data-tab]');
  if(t){ tab = t.dataset.tab; route(); }
});
document.getElementById('back').addEventListener('click', function(){ if(history.length > 1) history.back(); else go('#/'); });
window.addEventListener('hashchange', function(){ window.scrollTo(0, 0); route(); });
route();
</script>
</body>
</html>
