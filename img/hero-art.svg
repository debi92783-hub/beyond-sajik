<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="단어 블록이 계단처럼 쌓여 문장이 되는 그림">
  <!-- 비욘드잉글리쉬 사직어학원 메인페이지용으로 직접 그린 그림 (외부 저작물 없음) -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E2A33B" stop-opacity=".35"/>
      <stop offset="1" stop-color="#E2A33B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDE8DA"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B1122" flood-opacity=".35"/></filter>
  </defs>
  <circle cx="290" cy="235" r="200" fill="url(#glow)"/>
  <!-- 별 -->
  <g fill="#F6D58E">
    <path d="M86 70l5 11 11 5-11 5-5 11-5-11-11-5 11-5z"/>
    <path d="M478 120l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" opacity=".8"/>
    <circle cx="150" cy="140" r="3" opacity=".7"/><circle cx="420" cy="60" r="3.5" opacity=".8"/><circle cx="512" cy="230" r="2.5" opacity=".6"/><circle cx="60" cy="230" r="2.5" opacity=".6"/>
  </g>
  <!-- 펼친 책 -->
  <g filter="url(#sh)">
    <path d="M60 372c70-22 150-22 220 6v48c-70-26-150-26-220-6z" fill="url(#page)"/>
    <path d="M500 372c-70-22-150-22-220 6v48c70-26 150-26 220-6z" fill="url(#page)"/>
  </g>
  <path d="M280 378v48" stroke="#C9C1AA" stroke-width="2"/>
  <g stroke="#D9D1BC" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M92 380c45-10 100-10 160 4"/><path d="M92 396c45-10 100-10 160 4"/>
    <path d="M308 384c60-14 115-14 160-4"/><path d="M308 400c60-14 115-14 160-4"/>
  </g>
  <!-- 단어 블록 계단 -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="22" text-anchor="middle" filter="url(#sh)">
    <rect x="70" y="300" width="64" height="52" rx="8" fill="#FFFFFF"/><text x="102" y="333" fill="#1E2A44">I</text>
    <rect x="144" y="262" width="88" height="52" rx="8" fill="#FFFFFF"/><text x="188" y="295" fill="#1E2A44">want</text>
    <rect x="242" y="224" width="64" height="52" rx="8" fill="#FFFFFF"/><text x="274" y="257" fill="#1E2A44">to</text>
    <rect x="316" y="186" width="98" height="52" rx="8" fill="#E2A33B"/><text x="365" y="219" fill="#1E2A44" font-weight="700">speak</text>
    <rect x="424" y="148" width="74" height="52" rx="8" fill="#1E2A44" stroke="#FFFFFF" stroke-opacity=".5"/><text x="461" y="181" fill="#FFFFFF">up.</text>
  </g>
  <!-- 깃발 -->
  <path d="M461 148V86" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M463 88h40l-10 12 10 12h-40z" fill="#E2A33B"/>
  <!-- 오르는 화살표 -->
  <path d="M96 286C170 240 260 196 390 150" fill="none" stroke="#F6D58E" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>
</svg>
